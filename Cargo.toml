[package]
name = "polyfrost-crowdin-relay"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.9"
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
